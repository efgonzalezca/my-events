[tool.poetry]
name = "myevents-backend"
version = "0.1.0"
description = "My Events API"
authors = ["efgonzalezca <efgonzalezca@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.6"
uvicorn = {extras = ["standard"], version = "0.32.1"}
pydantic = "2.10.3"
pydantic-settings = "2.7.0"
sqlmodel = "0.0.22"
sqlalchemy = "2.0.36"
psycopg = {extras = ["binary"], version = "3.2.3"}

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
httpx = "0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

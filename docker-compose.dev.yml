services:
  db:
    ports:
      - "5438:5432"

  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
